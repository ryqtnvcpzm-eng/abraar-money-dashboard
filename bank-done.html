<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Money · Bank connected</title>
<style>
  :root { color-scheme: light dark; --bg: #f2f2f7; --card: #fff; --label: #000; --label-2: rgba(60,60,67,.6); }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --label: #fff; --label-2: rgba(235,235,245,.6); } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--label); font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
  .card { background: var(--card); border-radius: 22px; padding: 32px 24px; max-width: 360px; }
  .ok { width: 64px; height: 64px; border-radius: 16px; background: #34c759; display: grid; place-items: center; margin: 0 auto 16px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0; color: var(--label-2); }
</style>
</head>
<body>
<main><div class="card">
  <div class="ok" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h1>All done</h1>
  <p>Close this page and go back to Money. It finishes connecting by itself.</p>
</div></main>
</body>
</html>
